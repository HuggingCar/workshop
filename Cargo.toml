[workspace]
resolver = "3"
members = ["crates/posnet", "crates/agent", "crates/desktop"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
posnet = { path = "crates/posnet" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
