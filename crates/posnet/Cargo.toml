[package]
name = "posnet"
description = "Driver for Posnet Temo Online fiscal printers over the Posnet protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Simulator transport and standalone peer are never included in default releases.
sim = ["dep:parking_lot"]

[dependencies]
any_ascii = "0.3"
chrono.workspace = true
crc = "3"
encoding_rs = "0.8"
fd-lock = "4"
parking_lot = { version = "0.12", optional = true }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde_json.workspace = true
serialport = { version = "4", default-features = false }
tempfile = "3"
thiserror.workspace = true
unicode-general-category = "1"
unicode-normalization = "0.1"

[dev-dependencies]
posnet = { path = ".", features = ["sim"] }

[[bin]]
name = "posnet-simulator"
path = "src/bin/simulator.rs"
required-features = ["sim"]
