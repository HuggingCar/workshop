[project]
name = "fiscal-desktop"
version = "0.1.0"
description = "HuggingCar Fiscal: Polish desktop receipt application for Posnet Temo Online"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "posnet",
    "PySide6>=6.11,<7",
]

[project.scripts]
fiscal-desktop = "fiscal_desktop.__main__:main"

[tool.uv.sources]
posnet = { workspace = true }

[dependency-groups]
build = [
    "pyinstaller>=6.22,<7",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "fiscal_desktop"
