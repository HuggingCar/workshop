[project]
name = "workshop-agent"
version = "0.1.2"
description = "HuggingCar agent for the workshop PC: fiscal printing and other local duties"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fiscal-desktop",
    "posnet",
    "PySide6>=6.11,<7",
]

[project.scripts]
workshop-agent = "workshop_agent.__main__:main"

[tool.uv.sources]
fiscal-desktop = { workspace = true }
posnet = { workspace = true }

[dependency-groups]
build = ["pyinstaller>=6.22,<7"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "workshop_agent"
