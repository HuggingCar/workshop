name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Cargo.toml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.before || 'HEAD^' }}
        shell: bash
        run: |
          # Both applications inherit the release version from workspace.package.
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '
            [.packages[] | select(.name == "fiscal-desktop" or .name == "workshop-agent") | .version]
            | if length == 2 and .[0] == .[1] then .[0] else error("application versions differ") end')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release version: $version" >&2; exit 1; }
          tag="v$version"
          previous=""
          # Compare the whole push; manual runs compare with the selected commit's parent.
          # A missing root manifest is the first Rust release, not a version rollback.
          if [[ ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE:Cargo.toml" 2>/dev/null; then
            previous_version=$(git show "$BASE:Cargo.toml" | sed -n \
              '/^\[workspace.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p')
            [[ -z "$previous_version" ]] || previous="v$previous_version"
          fi
          if [[ "$tag" == "$previous" || "$(printf '%s\n' "$previous" "$tag" | sort -V | tail -n1)" != "$tag" ]]; then
            printf 'tag=%s\nnew=false\n' "$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | sort -V | tail -n1)
          new=false
          if [[ "$tag" != "$latest" && "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -n1)" == "$tag" ]]; then
            new=true
          fi
          echo "latest=$latest tag=$tag new=$new"
          printf 'tag=%s\nnew=%s\n' "$tag" "$new" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/checks.yml

  build:
    needs: [version, test]
    if: needs.version.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, os: windows-latest }
          - { name: mac-arm64, os: macos-latest }
          - { name: mac-x64, os: macos-26-intel }
          # Pin the oldest supported glibc baseline, even after ubuntu-latest advances.
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Enable MSVC tools for standalone executable checks
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Linux build and smoke-test dependencies (no GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdbus-1-dev libgl1-mesa-dri xvfb xauth dbus-x11
      - name: Build and smoke-test both Rust applications
        run: bash scripts/build.sh
        shell: bash
      - name: Install Linux packages and check startup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -qq ./dist/*.deb
          # No printer on the runner: both apps must show setup and stay alive.
          dbus-run-session -- xvfb-run -a bash packaging/smoke.sh /usr/bin/huggingcar-fiscal
          dbus-run-session -- xvfb-run -a bash packaging/smoke.sh /usr/bin/huggingcar-agent
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Generate and verify checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release create "$TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --generate-notes
