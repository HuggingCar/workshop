name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - LICENSE

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release is due when v<version> is newer than every published v* release.
          tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | sort -V | tail -n1)
          new=false
          if [[ "$tag" != "$latest" && "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -n1)" == "$tag" ]]; then
            new=true
          fi
          echo "latest=$latest tag=$tag new=$new"
          printf 'tag=%s\nnew=%s\n' "$tag" "$new" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/checks.yml

  build:
    needs: [version, test]
    if: needs.version.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, os: windows-latest }
          - { name: mac-arm64, os: macos-latest }
          - { name: mac-x64, os: macos-26-intel }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3 libglib2.0-0t64
      - run: bash packages/desktop/build.sh
        shell: bash
      - if: runner.os == 'Linux'
        name: Install the package and make sure the app comes up
        run: |
          sudo apt-get install -y -qq ./packages/desktop/release/*.deb
          # No printer on the runner: the app must reach its "not detected" state and stay alive.
          QT_QPA_PLATFORM=offscreen timeout 10 huggingcar-fiscal && exit 1 || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: packages/desktop/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release create "$TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --generate-notes
